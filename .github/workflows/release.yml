name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read  # pull requests (also from forks) build read-only; only the release job may write

jobs:
  build:
    name: build (windows)  # short, stable check name for the main branch ruleset
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish (one exe with .NET inside)
        run: |
          $extra = @(if ($env:VERSION) { "-p:Version=$env:VERSION" })
          dotnet publish -c Release -o publish @extra

      - name: Logic tests
        run: |
          $p = Start-Process publish/borderlessMax.exe --selftest -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-test check $($p.ExitCode) failed (see SelfTest.cs)" }

      - name: Smoke test (app must still be running after 10 s)
        run: |
          $p = Start-Process publish/borderlessMax.exe --tray -PassThru
          Start-Sleep 10
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          $p.Kill()

      - name: Package
        run: Copy-Item publish/borderlessMax.exe borderlessMax-windows.exe  # name is fixed: installed copies download it to update themselves

      - uses: actions/upload-artifact@v7
        with:
          name: borderlessMax-windows.exe
          path: borderlessMax-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*
          --repo "${{ github.repository }}" --title "borderlessMax ${{ github.ref_name }}" --generate-notes
